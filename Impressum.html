        function switchTab(tab) {
            currentTab = tab;
            const btnImp = document.getElementById('tab-impressum-btn');
            const btnDat = document.getElementById('tab-datenschutz-btn');

            if (tab === 'impressum') {
                btnImp.className = 'tab-btn active flex-1 py-2.5 rounded-xl text-xs font-mono uppercase tracking-wider transition-all cursor-pointer border border-transparent flex items-center justify-center gap-2';
                btnDat.className = 'tab-btn flex-1 py-2.5 rounded-xl text-xs font-mono uppercase tracking-wider text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent flex items-center justify-center gap-2';
            } else {
                btnDat.className = 'tab-btn active flex-1 py-2.5 rounded-xl text-xs font-mono uppercase tracking-wider transition-all cursor-pointer border border-transparent flex items-center justify-center gap-2';
                btnImp.className = 'tab-btn flex-1 py-2.5 rounded-xl text-xs font-mono uppercase tracking-wider text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent flex items-center justify-center gap-2';
            }
            renderContent();
        }

        function toggleLanguage() {
            curLang = (curLang === 'DE') ? 'EN' : 'DE';
            localStorage.setItem('fincast_lang', curLang);
            const langLabel = document.getElementById('lang-label');
            if (langLabel) langLabel.innerText = curLang;
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('legal-content');
            if (container) {
                container.innerHTML = legalData[curLang][currentTab];
            }
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('fincast_lang');
            if (savedLang) curLang = savedLang;
            const langLabel = document.getElementById('lang-label');
            if (langLabel) langLabel.innerText = curLang;

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('tab') === 'datenschutz') {
                switchTab('datenschutz');
            } else {
                switchTab('impressum');
            }
        };
    </script>
